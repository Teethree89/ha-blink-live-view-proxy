name: Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build standalone image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Only used on a tag; a pull request build never pushes.
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/teethree89/ha-blink-live-view-proxy
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # Every push and pull request builds, so a broken Dockerfile fails here
      # rather than on someone's NAS. Only a tag publishes.
      - name: Build (and push on a tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          # Matches the add-on's architectures. Building both on every pull
          # request is slower, but an arm64-only breakage found at tag time is
          # found by the person it breaks.
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
