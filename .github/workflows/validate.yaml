name: Validate

on:
  # Only main on push. Without the filter every push to a PR branch fires this
  # twice — once as `push`, once as `pull_request` — and the two can disagree,
  # because re-running one leaves the other holding a stale verdict.
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Hassfest
        uses: home-assistant/actions/hassfest@master

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint
        # Rules are in ruff.toml, chosen to catch mistakes rather than style.
        # It has already caught an unused import and an annotation naming a
        # type its module never imported.
        run: pipx run ruff check .

      - name: Install test dependencies
        # Deliberately minimal, and nothing here contacts Blink. A login
        # attempt on every CI run would be rate-limited within minutes and
        # would text the account owner each time.
        run: pip install pyyaml -r proxy/requirements.txt

      - name: Compile every tracked Python file
        run: python -m compileall -q $(git ls-files '*.py')

      - name: Check shell script syntax
        run: |
          for script in $(git ls-files '*.sh'); do
            bash -n "$script"
          done

      - name: HLS playlist tests
        run: python tests/test_playlist.py

      - name: Asset and generator tests
        run: python tests/test_assets.py

      - name: Login decision tests
        run: python tests/test_login_decisions.py

      - name: Browser authentication tests
        run: python tests/test_authentication.py

      - name: Browser token refresh tests
        run: python tests/test_browser_token.py

      - name: Self-update tests
        run: python tests/test_self_update.py

      - name: Admin dashboard tests
        run: python tests/test_panel_dashboard.py

      - name: Prerequisite readout tests
        run: python tests/test_prerequisites.py

      - name: ffmpeg logging tests
        run: python tests/test_ffmpeg_log.py

      - name: ffmpeg argument tests
        run: python tests/test_ffmpeg_args.py

      - name: Frontend resource registration tests
        run: python tests/test_frontend_resource.py

      - name: RTSP relay tests
        run: python tests/test_rtsp.py

      - name: Clip cache and thumbnail tests
        run: python tests/test_clip_cache.py
