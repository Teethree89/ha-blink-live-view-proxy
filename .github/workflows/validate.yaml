name: Validate

on:
  # Only main on push. Without the filter every push to a PR branch fires this
  # twice — once as `push`, once as `pull_request` — and the two can disagree,
  # because re-running one leaves the other holding a stale verdict.
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      # Pinned by image digest, and it has to be the digest rather than a tag.
      # hacs/action is a Docker action whose action.yml hardcodes
      # `image: docker://ghcr.io/hacs/action:main` - on every git ref it has,
      # including the 22.5.0 release from 2022. So `hacs/action@22.5.0` pins the
      # action.yml and still pulls a floating `:main` image: the git ref pins
      # nothing that runs.
      #
      # Left unpinned it bit us. On one branch, validation failed three times
      # across two shas while hacs.json and manifest.json were byte-identical to
      # a main that passed minutes earlier; only the two checks that read file
      # contents failed, with "Integration manifest validation failed for: None".
      # The same commits on a differently-named branch passed at once.
      #
      # This digest is the image that validated this repository on 2026-09-10.
      # Bump it deliberately; the nightly job below says when it is worth doing.
      - name: HACS validation
        if: github.event_name != 'schedule'
        uses: docker://ghcr.io/hacs/action@sha256:dc92fdad2f6ffbe74bffb7269d781ea8e064f52d9bb486cdf3925d74e7ab6ebf
        with:
          category: integration
          comment: "true"
          # A direct docker:// step gets no action.yml, so the input defaults
          # defined there do not apply and the token has to be passed by hand.
          github_token: ${{ github.token }}

      # The canary, and the reason pinning is safe rather than a slow drift into
      # non-compliance. HACS's rules move, and this repository is heading for a
      # hacs/default submission that will be judged by whatever HACS runs on the
      # day. Once a night, on main only, validate against current HACS: a failure
      # here means the rules changed and the pin above needs a look, without a
      # third party ever turning somebody's pull request red unannounced.
      - name: HACS validation against current rules
        if: github.event_name == 'schedule'
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Same reasoning as the HACS job above, one layer deeper.
      # home-assistant/actions/hassfest is a *composite* action whose only real
      # step is `docker run ghcr.io/home-assistant/hassfest` - with no tag at
      # all, so it resolves to :latest. Pinning the git ref (or the repo's lone
      # 1.0.0 tag) would pin the composite wrapper and still run a floating
      # image, so again the digest is the only thing that pins what runs.
      #
      # This digest is the image that validated this repository on 2026-09-10.
      #
      # The composite also installs a problem matcher, which turns hassfest's
      # "* [ERROR] ..." lines into annotations on the run. Calling the image
      # directly skips the wrapper and would lose that, so the matcher is
      # vendored next to this file - it is fourteen lines and one regex.
      - name: Hassfest annotations
        if: github.event_name != 'schedule'
        run: echo "::add-matcher::.github/hassfest-problem-matcher.json"

      - name: Hassfest
        if: github.event_name != 'schedule'
        uses: docker://ghcr.io/home-assistant/hassfest@sha256:d0f082cb684c7560666138e501cdbe36137927acb075e276729728179108651d

      # The canary. hassfest tracks Home Assistant itself and its rules move
      # with each release, so main is validated against the current image once
      # a night: a failure there means the pin above needs a look, without a
      # rule that landed this morning turning somebody's pull request red.
      - name: Hassfest against current rules
        if: github.event_name == 'schedule'
        uses: home-assistant/actions/hassfest@master

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint
        # Rules are in ruff.toml, chosen to catch mistakes rather than style.
        # It has already caught an unused import and an annotation naming a
        # type its module never imported.
        run: pipx run ruff check .

      - name: Install test dependencies
        # Deliberately minimal, and nothing here contacts Blink. A login
        # attempt on every CI run would be rate-limited within minutes and
        # would text the account owner each time.
        run: pip install pyyaml -r proxy/requirements.txt

      - name: Compile every tracked Python file
        run: python -m compileall -q $(git ls-files '*.py')

      - name: Check shell script syntax
        run: |
          for script in $(git ls-files '*.sh'); do
            bash -n "$script"
          done

      - name: HLS playlist tests
        run: python tests/test_playlist.py

      - name: Asset and generator tests
        run: python tests/test_assets.py

      - name: Login decision tests
        run: python tests/test_login_decisions.py

      - name: Browser authentication tests
        run: python tests/test_authentication.py

      - name: Browser token refresh tests
        run: python tests/test_browser_token.py

      - name: Self-update tests
        run: python tests/test_self_update.py

      - name: Admin dashboard tests
        run: python tests/test_panel_dashboard.py

      - name: Prerequisite readout tests
        run: python tests/test_prerequisites.py

      - name: ffmpeg logging tests
        run: python tests/test_ffmpeg_log.py

      - name: ffmpeg argument tests
        run: python tests/test_ffmpeg_args.py

      - name: Frontend resource registration tests
        run: python tests/test_frontend_resource.py

      - name: RTSP relay tests
        run: python tests/test_rtsp.py

      - name: HLS save tests
        run: python tests/test_hls_save.py

      - name: Clip cache and thumbnail tests
        run: python tests/test_clip_cache.py

      - name: Add-on address tests
        run: python tests/test_addon_address.py

      - name: Clip route guard tests
        run: python tests/test_clip_route_guard.py

      - name: const export tests
        run: python tests/test_const_exports.py

      - name: device tree tests
        run: python tests/test_via_device_id.py

      - name: Blink device poll and route tests
        # Runs blinkpy's real Auth and Blink with the network faked, and fails
        # if a failed token refresh reaches any sign-in or 2FA entry point.
        run: python tests/test_device_poll.py

      - name: Blink entity naming and value tests
        run: python tests/test_blink_devices.py

      - name: Camera controls tests
        run: python tests/test_camera_controls.py

      - name: Live-view command tests
        run: python tests/test_liveview_commands.py

      - name: Player layout tests
        run: python tests/test_player_layout.py

  home-assistant:
    name: Home Assistant (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Two releases on either side of via_device_id: the older has only
          # via_device, and device_parent.py must fall back to it there.
          - label: "2026.2"
            python: "3.13"
            harness: "pytest-homeassistant-custom-component==0.13.316"
          - label: "2026.9"
            python: "3.14"
            harness: "pytest-homeassistant-custom-component==0.13.365"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Home Assistant test harness
        # blinkpy without its dependencies: it pins newer aiohttp and requests
        # than Home Assistant does, and the proxy code under test only needs
        # its modules to import. Nothing here contacts Blink.
        run: |
          # PyTurboJPEG: Home Assistant's camera component imports it.
          pip install "${{ matrix.harness }}" PyTurboJPEG
          pip install --no-deps blinkpy==0.25.9 aiofiles sortedcontainers python-slugify

      - name: Blink entity platform tests
        run: pytest tests/ha -o asyncio_mode=auto -p no:cacheprovider
