# Blink live-view proxy — Home Assistant package
#
# Drop into config/packages/ and reference it from configuration.yaml:
#
#   homeassistant:
#     packages: !include_dir_named packages
#
# Everything here is optional. The integration already provides
# binary_sensor.blink_liveview_proxy on its own; this package adds the proxy's
# richer /status detail, the status pills the dashboards use, and a
# notification when the proxy needs a human.
#
# There is deliberately no reload button. It used to reload Home Assistant's
# own Blink integration, which this setup no longer uses, and every reload of
# that was a Blink login - on 2026-08-18 a reload loop texted a 2FA code every
# five minutes until Blink rate-limited the account.

# HA's stream component, for the camera entities' HLS rendition.
stream:

# ---------------------------------------------------------------------------
# Proxy status
#
# The proxy serves /status unauthenticated on loopback, the same as /health,
# and it exposes no camera names, serials or tokens. If you bound the proxy to
# the LAN and set BLINK_PROXY_TOKEN, add the matching header:
#
#   headers:
#     Authorization: !secret blink_proxy_token
# ---------------------------------------------------------------------------
rest:
  - resource: "http://127.0.0.1:8088/status"
    scan_interval: 60
    timeout: 10
    sensor:
      - name: Blink Proxy
        unique_id: blink_proxy_status
        icon: mdi:cctv
        value_template: "{{ 'online' if value_json.ready else 'offline' }}"
        json_attributes:
          - ready
          - cameras_discovered
          - cameras_configured
          - token_seconds_remaining
          - process_uptime_seconds
          - watchdog_attempts
          - watchdog_last_restart

template:
  - sensor:
      # "5 of 6" — the number that actually tells you something is wrong.
      - name: Blink Cameras Discovered
        unique_id: blink_cameras_discovered
        icon: mdi:camera-outline
        state: >-
          {{ state_attr('sensor.blink_proxy', 'cameras_discovered') | int(0) }}
        attributes:
          configured: >-
            {{ state_attr('sensor.blink_proxy', 'cameras_configured') | int(0) }}

      - name: Blink Proxy Uptime
        unique_id: blink_proxy_uptime
        icon: mdi:timer-outline
        unit_of_measurement: min
        state: >-
          {{ (state_attr('sensor.blink_proxy', 'process_uptime_seconds')
              | float(0) / 60) | round(0) }}

  - binary_sensor:
      # Cameras are configured but the proxy did not find all of them.
      - name: Blink Cameras Missing
        unique_id: blink_cameras_missing
        device_class: problem
        icon: mdi:camera-off-outline
        state: >-
          {% set found = state_attr('sensor.blink_proxy', 'cameras_discovered') | int(-1) %}
          {% set want  = state_attr('sensor.blink_proxy', 'cameras_configured') | int(0) %}
          {{ found >= 0 and want > 0 and found < want }}

      # The watchdog restarted the proxy and it did not recover. After three
      # tries it gives up on purpose: more restarts mean more login attempts,
      # and that is what triggers a burst of 2FA texts.
      - name: Blink Needs Attention
        unique_id: blink_needs_attention
        device_class: problem
        icon: mdi:alert-decagram-outline
        state: >-
          {{ state_attr('sensor.blink_proxy', 'watchdog_attempts') | int(0) >= 3
             or is_state('binary_sensor.blink_liveview_proxy', 'off') }}

# Tell someone once, rather than letting them discover it.
automation:
  - alias: Blink needs attention
    id: blink_needs_attention_notify
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.blink_needs_attention
        to: "on"
        for: "00:05:00"
    actions:
      - action: persistent_notification.create
        data:
          title: Blink live view needs attention
          notification_id: blink_needs_attention
          message: >-
            The proxy has not recovered on its own.
            {% set n = state_attr('sensor.blink_proxy', 'watchdog_attempts') | int(0) %}
            {% if n >= 3 %}The watchdog restarted it {{ n }} times and stopped,
            which usually means the Blink session needs a manual re-auth in the
            admin-only Blink Authentication panel.
            {% else %}The proxy is not answering.{% endif %}

# ---------------------------------------------------------------------------
# Restarting the proxy
#
# Host-specific, so it is left commented out. Pick what matches your setup.
#
#   Add-on (Supervisor)   use the add-on's own restart button, or a
#                         hassio.addon_restart action.
#
#   systemd on the host,  HA in a container cannot reach the host's systemd.
#   HA in Docker          Have a root-owned systemd path unit watch a spool
#                         file that HA is able to write, and restart the
#                         service when it appears.
# ---------------------------------------------------------------------------
# shell_command:
#   blink_proxy_restart: "touch /config/spool/blink-liveview-proxy-restart"
