# Generated by scripts/generate-dashboard.py
# 6 camera(s) from http://127.0.0.1:8088
#
# This is a WHOLE DASHBOARD. The top-level `views:` key is the complete config
# for one dashboard, so pasting all of it replaces every view on whichever
# dashboard you paste it into.
#
#   Settings -> Dashboards -> + Add dashboard -> New dashboard from scratch,
#   open it, pencil -> ... -> Raw configuration editor, select all, paste, Save.
#
# To add it to a dashboard you already have, re-run with --format view.
#
# Needs button-card, and this dashboard resource registered under
# Settings -> Dashboards -> Resources, as a JavaScript module:
#   /api/blink_liveview_proxy/static/blink-liveview-dialog.js
#
# The motion-detection button assumes the official Blink integration named its
# switch after the slug. Fix or delete any that show as unavailable.
views:
  - title: Cameras
    path: cameras
    cards:
      - type: horizontal-stack
        cards:
          - type: custom:button-card
            entity: binary_sensor.blink_liveview_proxy
            name: Proxy
            show_state: true
            icon: mdi:cctv
            state:
              - value: "on"
                color: "#22c55e"
                icon: mdi:cctv
              - value: "off"
                color: "#ef4444"
                icon: mdi:cctv-off
            styles:
              card: [[height, 74px]]
              name: [[font-size, 12px]]
      # Back Door — catalina (push-to-talk available)
      - type: picture-elements
        camera_image: camera.back_door
        camera_view: auto
        aspect_ratio: 16x9
        elements:
          - type: custom:button-card
            entity: camera.blink_live_back_door
            show_icon: false
            show_name: false
            show_state: false
            tap_action:
              action: fire-dom-event
              blink_liveview_proxy:
                slug: back_door
                entity_id: camera.blink_live_back_door
                title: Back Door
            styles:
              card:
                - height: 100%
                - padding: 0
                - border: 0
                - box-shadow: none
                - background: rgba(0, 0, 0, 0)
            style:
              top: 0
              left: 0
              width: 100%
              height: 100%
              transform: none
              z-index: 1
          - type: custom:button-card
            show_icon: false
            show_state: false
            name: Back Door
            styles:
              card:
                - background: rgba(0, 0, 0, 0)
                - border: 0
                - box-shadow: none
                - padding: 0
              name:
                - color: white
                - font-size: 14px
                - font-weight: 600
                - text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8)
            style:
              bottom: 8px
              left: 12px
              transform: none
              z-index: 2
          - type: custom:button-card
            icon: mdi:filmstrip
            show_name: false
            tap_action:
              action: fire-dom-event
              blink_liveview_proxy_clips:
                slug: back_door
                title: Back Door Clips
            styles:
              card:
                - background: rgba(2, 6, 23, 0.55)
                - border-radius: 999px
                - border: 0
                - width: 36px
                - height: 36px
                - padding: 0
              icon:
                - color: white
                - width: 20px
            style:
              bottom: 8px
              right: 100px
              transform: none
              z-index: 2
          - type: custom:button-card
            icon: mdi:image-refresh
            show_name: false
            tap_action:
              action: fire-dom-event
              blink_snapshot_refresh:
                slug: back_door
                source_entity_id: camera.back_door
            styles:
              card:
                - background: rgba(2, 6, 23, 0.55)
                - border-radius: 999px
                - border: 0
                - width: 36px
                - height: 36px
                - padding: 0
              icon:
                - color: white
                - width: 20px
            style:
              bottom: 8px
              right: 54px
              transform: none
              z-index: 2
          - type: custom:button-card
            entity: switch.back_door_camera_motion_detection
            show_name: false
            icon: >
              [[[
                return entity && entity.state === 'on'
                  ? 'mdi:motion-sensor'
                  : 'mdi:motion-sensor-off';
              ]]]
            tap_action:
              action: toggle
            styles:
              card:
                - background: rgba(2, 6, 23, 0.55)
                - border-radius: 999px
                - border: 0
                - width: 36px
                - height: 36px
                - padding: 0
              icon:
                - width: 20px
                - color: >
                    [[[
                      return entity && entity.state === 'on'
                        ? '#38bdf8'
                        : '#94a3b8';
                    ]]]
            style:
