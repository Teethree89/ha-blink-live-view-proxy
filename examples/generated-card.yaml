# Generated by scripts/generate-dashboard.py
# 4 example camera(s). These are made up — run
# without --demo to build this from your own cameras.
#
# This is a SINGLE CARD. It drops into any existing view without touching the
# rest of the dashboard.
#
#   Open the dashboard, pencil -> + Add card -> scroll down -> Manual,
#   replace what is in the box with this, Save.
#
# Needs button-card, and this dashboard resource registered under
# Settings -> Dashboards -> Resources, as a JavaScript module:
#   /api/blink_liveview_proxy/assets/blink-liveview-dialog.js
#
# The motion-detection button assumes the official Blink integration named its
# switch after the slug. Fix or delete any that show as unavailable.
type: vertical-stack
cards:
  - type: horizontal-stack
    cards:
      - type: custom:button-card
        entity: binary_sensor.blink_liveview_proxy
        name: Proxy
        show_state: true
        icon: mdi:cctv
        state:
          - value: "on"
            color: "#22c55e"
            icon: mdi:cctv
          - value: "off"
            color: "#ef4444"
            icon: mdi:cctv-off
        styles:
          card:
            - height: 74px
          name:
            - font-size: 12px
  - type: grid
    columns: 2
    square: false
    cards:
      # Back Yard — catalina (push-to-talk available)
      - type: picture-elements
        camera_image: camera.back_yard
        camera_view: auto
        aspect_ratio: 16x9
        elements:
          - type: custom:button-card
            entity: camera.blink_live_back_yard
            show_icon: false
            show_name: false
            show_state: false
            tap_action:
              action: fire-dom-event
              blink_liveview_proxy:
                slug: back_yard
                entity_id: camera.blink_live_back_yard
                title: Back Yard
            styles:
              card:
                - height: 100%
                - padding: 0
                - border: 0
                - box-shadow: none
                - background: rgba(0, 0, 0, 0)
            style:
              top: 0
              left: 0
              width: 100%
              height: 100%
              transform: none
              z-index: 1
          - type: custom:button-card
            show_icon: false
            show_state: false
            name: Back Yard
            styles:
              card:
                - background: rgba(0, 0, 0, 0)
                - border: 0
                - box-shadow: none
                - padding: 0
              name:
                - color: white
                - font-size: 14px
                - font-weight: 600
                - text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8)
            style:
              bottom: 8px
              left: 12px
              transform: none
              z-index: 2
          - type: custom:button-card
            icon: mdi:filmstrip
            show_name: false
            tap_action:
              action: fire-dom-event
              blink_liveview_proxy_clips:
                slug: back_yard
                title: Back Yard Clips
            styles:
              card:
                - background: rgba(2, 6, 23, 0.55)
                - border-radius: 999px
                - border: 0
                - width: 36px
                - height: 36px
                - padding: 0
              icon:
                - color: white
                - width: 20px
            style:
              bottom: 8px
              right: 100px
              transform: none
              z-index: 2
          - type: custom:button-card
            icon: mdi:image-refresh
            show_name: false
            tap_action:
              action: fire-dom-event
              blink_snapshot_refresh:
                slug: back_yard
                source_entity_id: camera.back_yard
            styles:
              card:
                - background: rgba(2, 6, 23, 0.55)
                - border-radius: 999px
                - border: 0
                - width: 36px
                - height: 36px
                - padding: 0
              icon:
                - color: white
                - width: 20px
            style:
              bottom: 8px
              right: 54px
              transform: none
              z-index: 2
          - type: custom:button-card
            entity: switch.back_yard_camera_motion_detection
            show_name: false
            icon: >
              [[[
                return entity && entity.state === 'on'
                  ? 'mdi:motion-sensor'
                  : 'mdi:motion-sensor-off';
              ]]]
            tap_action:
              action: toggle
            styles:
              card:
                - background: rgba(2, 6, 23, 0.55)
                - border-radius: 999px
                - border: 0
                - width: 36px
                - height: 36px
                - padding: 0
              icon:
                - width: 20px
                - color: >
                    [[[
                      return entity && entity.state === 'on'
                        ? '#38bdf8'
                        : '#94a3b8';
                    ]]]
            style:
              bottom: 8px
              right: 8px
              transform: none
              z-index: 2
