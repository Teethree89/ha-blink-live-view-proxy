name: "Blink Live View Proxy"
description: >-
  Unofficial local live-view proxy and clip archive for Blink cameras. Not
  affiliated with, endorsed by, or supported by Amazon or Blink.
  Install the matching integration via HACS (or from custom_components/ in this repo).
version: "0.7.0-rc.3"
slug: "blink_liveview_proxy"
init: false
# armhf and armv7 are deliberately absent: Supervisor deprecated both, and
# ffmpeg transcoding a live stream is beyond what that hardware manages
# usefully anyway.
arch:
  - aarch64
  - amd64
startup: services
boot: auto
options:
  blink_username: ""
  blink_password: ""
  blink_2fa_code: ""
  proxy_api_token: ""
  port: 8088
  low_latency: false
  cameras: []
  ptt_disabled_product_types: []
  ptt_disabled_camera_types: []
  ptt_force_enabled_slugs: []
schema:
  blink_username: str
  blink_password: str
  blink_2fa_code: str
  proxy_api_token: str
  port: int
  low_latency: bool
  cameras:
    - slug: str
      entity_id: str
      name: str?
      id: int?
      serial: str?
  # Which cameras are offered push-to-talk. A systemd or Docker install could
  # always set these in config.json; an add-on install could not reach them at
  # all, which is why they are here. Each one left empty means "keep the
  # proxy's own default" rather than "allow everything", so an empty box can
  # never silently switch push-to-talk on for a camera family that cannot do
  # it.
  ptt_disabled_product_types:
    - str
  ptt_disabled_camera_types:
    - str
  ptt_force_enabled_slugs:
    - str
ports:
  8088/tcp: null
ports_description:
  8088/tcp: "Blink Live View Proxy HTTP API"
# Permissions, and why each one is here.
#
# hassio_api is REQUIRED. While the proxy waits for a 2FA code it has to read
# the add-on option you just typed, and /data/options.json is only written at
# add-on start — a value entered while we wait never reaches it. The
# Supervisor API is the only way to see it. One endpoint is used,
# /addons/self/info, and only blink_2fa_code is read from it. No hassio_role
# is set, so this stays on the default read-mostly tier.
#
# share:rw is NOT required. It is a redundancy, kept deliberately. The
# Supervisor option above is the primary path and always works, because an
# add-on only exists under Supervisor in the first place, and
# /data/blink_2fa_pin.txt already covers the file case under the existing
# data:rw. What /share buys is reach: it is visible to the Samba and file
# editor add-ons, so the PIN can be dropped in from anything on the network
# when the options route is awkward.
#
# Know what that costs. /share is shared with every other add-on that maps
# it, so a PIN written there is briefly readable by them; the proxy deletes
# the file as soon as it reads it. To drop the redundancy, remove share:rw
# below and the /share entry from PIN_FILES in blink_proxy/blink.py. Nothing
# else depends on it.
# homeassistant_config:rw is what makes setup hands-off. The add-on writes its
# generated proxy token to blink_liveview_proxy.token in the Home Assistant
# config directory, and the integration's config flow pre-fills the token from
# it, so no one has to read a token out of one screen and type it into another.
# Nothing else is written there, and the file holds only that token.
# What is worth keeping in a backup, and what is not.
#
# All three of these are rebuildable and none is needed to restore an install:
# the clip cache is clips fetched from Blink with their thumbnails, capped at
# 512 MB; the live-view cache is recordings of sessions already watched; and
# hls/ is segments of a stream that is over. Half a gigabyte of video does not
# belong in every snapshot the user takes. The Blink session, the generated
# token and the config stay in the backup, which is what a restore needs.
backup_exclude:
  - clips/
  - liveviews/
  - hls/
hassio_api: true
map:
  - data:rw
  - share:rw
  - homeassistant_config:rw
url: "https://github.com/Teethree89/ha-blink-live-view-proxy"
